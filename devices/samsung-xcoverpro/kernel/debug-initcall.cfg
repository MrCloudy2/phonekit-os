# Measurement build: log the duration of every initcall.
# The bootloader ignores boot.img's cmdline, so arguments go through CONFIG_CMDLINE (+ CMDLINE_EXTEND).
# Keep the sku argument from the base defconfig (NFC/eSE needs it in LineageOS).
CONFIG_CMDLINE="androidboot.product.hardware.sku=hcesimese initcall_debug log_buf_len=8M"
