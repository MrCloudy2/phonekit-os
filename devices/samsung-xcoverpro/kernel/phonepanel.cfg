# phonepanel kernel trim for the XCover Pro (merged on top of exynos9611-xcoverpro_defconfig).
# Measured with initcall_debug (docs/verification/M1.md); only drivers phonepanel doesn't use.

# Audio: rt5665 codec probe alone took 390 ms, rt5510 amp 44 ms, machine driver 32 ms
# CONFIG_SND_SOC_SAMSUNG_VOGUE_RT5665 is not set
# CONFIG_SND_SOC_RT5665 is not set
# CONFIG_SND_SOC_RT5510 is not set

# Cameras (fimc-is, 66 ms) stay for now: the SM5713 flash/torch LED driver links against
# fimc-is's camera_class, and the torch may be useful as a status light.

# NFC/eSE stay (only 16 ms). Removing them hung the kernel before the display came up
# (2026-11-15, no log). Likely cause: CONFIG_ESE_SECURE reserves SPI port 5 for the secure
# world; without it the normal-world SPI driver probes a TrustZone-owned bus.

# USB HID gadget function for Mode A's multitouch digitizer (M5/M6). Inert until configfs
# instantiates it, so it can't affect boot.
CONFIG_USB_CONFIGFS_F_HID=y

# USB mass storage gadget (M6d: flash drive / bootable ISO). Inert until configfs uses it.
CONFIG_USB_CONFIGFS_MASS_STORAGE=y
