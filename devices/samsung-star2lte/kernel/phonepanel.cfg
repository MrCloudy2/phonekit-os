# Config fragment merged on top of the device defconfig. One change at a time; note why and what it saved.
# Needed for MOUSE/KEYBOARD/SCREEN touch:
CONFIG_USB_CONFIGFS_F_HID=y
# Needed for the flash-drive mode (M6d):
CONFIG_USB_CONFIGFS_MASS_STORAGE=y
# A missing firmware file fails at once instead of waiting for a userspace helper PhoneKit doesn't run: bcmdhd asks
# for logstrs.bin (not shipped) on every Wi-Fi power-up, and the 25 s fallback made paneld's scan time out and kill
# ifconfig mid power-up ("request_irq failed with -4", 2026-11-19).
# CONFIG_FW_LOADER_USER_HELPER_FALLBACK is not set
# Bluetooth: paneld bridges the Broadcom UART to the virtual HCI, as on the XCover Pro (M10c)
CONFIG_BT_HCIVHCI=y
