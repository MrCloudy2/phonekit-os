# PhoneKit device record: Samsung Galaxy S9+ (Exynos). Third PhoneKit phone: pptest 92 pass / 0 fail / 1 skip on
# 2026-11-19 (source-built LineageOS 24.0 kernel). Open: auto-rotate (blocked, as on the S8), a long soak, boot time.
# Values were read on 2026-11-19 from the test phone running LineageOS 23.2 (adb root): getprop, /proc/config.gz,
# scripts/probe.sh, getevent, blockdev. The boot image layout comes from its RECOVERY dump (sha256 fc9ad790…a879)
# read with scripts/samsung-bootimg.py. Public sources are named where used.
schema: 0

identity:
  name: Samsung Galaxy S9+
  model: SM-G965F
  codename: star2lte
  soc: Exynos 9810 (universal9810)
  soc_dir: socs/exynos9810
  ram_gb: 6                  # MemTotal 5790340 kB
  battery_removable: false
  board_revision: 26         # ro.boot.revision; probe: "Samsung Star2 rev26 board based on EXYNOS9810"
  siblings: "Galaxy S9 (SM-G960F, starlte) and Note 9 (SM-N960F, crownlte) share the kernel tree; separate defconfigs and DTBs"

panel:
  resolution: [1440, 2960]
  type: OLED                 # Super AMOLED, 6.2"
  controller: Samsung S6E3HA8 (CONFIG_EXYNOS_DECON_LCD_S6E3HA8); /sys/class/lcd/panel/lcd_type SDC_D11443

boot:
  unlock: >-
    OEM unlocking in developer options (wipes, trips Knox). Already unlocked on the test phone: it runs an
    unofficial LineageOS. The ROM spoofs the lock props (ro.boot.flash.locked=1, verifiedbootstate=green,
    warranty_bit=0), so read the real state in download mode
  flash_tool: heimdall
  download_mode: phone off, hold Vol Down + Bixby + Power, then Vol Up to continue (LineageOS wiki, starlte/star2lte)
  recovery_combo: phone off, hold Vol Up + Bixby + Power, release when the blue text appears
  forced_reset: Vol Down + Power ~10 s
  image_header_version: "0 (Samsung variant: DTB table size at offset 40, DTBH table after second; same as the S8)"
  page_size: 2048
  load_addresses: "kernel 0x10008000, ramdisk 0x11000000, second 0x10f00000, tags 0x10000100"
  trailer: "SEANDROIDENFORCE after the DT table (Samsung's mkbootimg.mk appends it)"
  partition: RECOVERY        # upper case; /dev/block/by-name/RECOVERY -> sda11
  partition_size: 68149248   # blockdev --getsize64 (2026-11-19); LineageOS BoardConfig agrees
  boot_partition_size: 57671680
  dtb_dtbo_partitions: "DTB (sda8) and DTBO (sda9) exist, 8 MiB each, all zeros: the DT table lives in the boot/recovery images"
  avb: none (no footer in the LineageOS images)
  ab_slots: false
  stock_bootloader: G965FXXUHFVG4 (ro.bootloader on the test phone)
  rom: "LineageOS 24.0-20261112-UNOFFICIAL-star2lte (Android 17, krazey90, XDA; source github.com/ExyHyperBrick). Upgraded from 23.2-20260614 on 2026-11-19 keeping userdata. Fingerprint says userdebug while ro.build.type=user / ro.debuggable=0 are spoofed; adb root works (USB and Wi-Fi debugging)"
  rom_upgrade_23_to_24: "24.0 turns the ODM partition (sda20) into ext4 /metadata. From 23.2 without wiping: flash the 24.0 recovery, enable ADB in its Advanced menu, run lineage-24.0-initialize-metadata-sideload.zip (formats ODM only), sideload the ROM, then GApps (MindTheGapps 17) before the first boot. An unplugged cable mid-sideload gave 'Install completed with status 2' and nothing broke: resending the ROM fixed it"
  recovery_restore: "persist.vendor.recovery_update=true and vendor_flash_recovery.rc: the ROM rewrites RECOVERY at boot. Set it to false before flashing PhoneKit (docs/recovery.md)"
  recovery_on_phone: "LineageOS 24.0 recovery (lineage-24.0-20261112-recovery-star2lte.img, md5 147bc745…93421); the maintainer supports only Lineage Recovery, not TWRP. Its adb starts unauthorized: Advanced -> Enable ADB"

kernel:
  version: "4.9.337-ies-g401189fdfc65 (LineageOS 24.0 ROM kernel, Android clang 22.0.2); PhoneKit runs the same commit built from source with host clang 23"
  source: https://github.com/ExyHyperBrick/android_kernel_samsung_exynos9810 commit 401189fdfc65 (branch lineage-24.0, 2026-11-10). 23.2 ran 87ff302a9ad9 (lineage-23.2-bpf-test)
  build: "host clang 23 + ld.lld; KERNEL_KCFLAGS turns three new clang diagnostics back into warnings (device.mk); kernel-patches/0001 mkcompile_h. The source build's config equals the ROM kernel's /proc/config.gz plus kernel/phonepanel.cfg (F_HID, mass storage)"
  defconfig: exynos9810-star2lte_defconfig (LOCALVERSION -ies)
  older_source: "LineageOS/android_kernel_samsung_exynos9810 lineage-20 (4.9.118), the last official LineageOS (20) tree; not what runs here"
  features: { devtmpfs: false, configfs: true, functionfs: true, hid_gadget: true, mass_storage_gadget: true, pstore_ramoops: true, modules: true }   # source build; the ROM kernel has no f_hid / mass storage
  prebuilt: LineageOS 24.0 recovery.img (DT table; its kernel for KERNEL=prebuilt)

display:
  api: fbdev                 # Samsung DECON (CONFIG_EXYNOS_DECON_FB, CONFIG_EXYNOS_DECON_9810)
  node: /dev/fb0
  bits_per_pixel: 32         # probe.sh under LineageOS
  stride: 5760
  virtual: [1440, 5920]      # double buffer via pan
  backlight: /sys/class/backlight/panel (max 44800)
  color_order_verified: true   # 2026-11-19 by eye (owner): PHONEBOX labels in their colours with hw.c fb_swap_rb = 1 (BGR, as LineageOS's ABGR_8888 said)
  verified: true               # 2026-11-19: first boot showed the PHONEBOX dashboard (screenshot); test-display 5/5

input:
  touch: { name: sec_touchscreen, node: event0, max_x: 4095, max_y: 4095, slots: 10, verified: true }   # getevent -lp; test-touch 10/10; by eye in SCREEN mode (owner, 2026-11-19)
  keys: { name: gpio_keys, node: event5, codes: [VOLUMEDOWN, VOLUMEUP, POWER, 0x2bf], verified: true }   # 0x2bf = Bixby (KEY_WINK in the DTS); paneld 'keys power volup voldown bixby', test-keys 8/8
  key_roles: "Bixby = mode key, no page key (hold Vol Up/Down for pages), as on the S8"
  # LineageOS 23.2 event order: event0 sec_touchscreen, event1 grip_sensor, event2 ssp_context, event3 hrm_sensor,
  # event4 Headset, event5 gpio_keys, event6 hall, event7 certify_hall, event8 uinput-sec-fp

usb:
  udc: 10c00000.dwc3
  speed: super-speed         # max_speed under LineageOS
  gadget_configfs: true
  samsung_composite: true    # CONFIG_USB_ANDROID_SAMSUNG_COMPOSITE + CONFIG_USB_CONFIGFS_UEVENT in /proc/config.gz
  hid_gadget: true           # source-built kernel; not in the LineageOS kernels
  config_name: "Conf 1"      # required: any other name triggers the kernel's GSI 'ADB only' path (hw.c usb_config_name)
  verified: true             # 2026-11-19: 3 ACM + RNDIS + adb (18d1:4ee4), mode A HID x4 + GUD; test-usb 11/11, input-modes 16/16

power:
  charger: Maxim MAX77705 (with MAX77705 fuel gauge, mfc-charger wireless, ps power sharing)
  charge_limit_method: "battery/batt_slate_mode = 1 stops charging (no battery/charging_enabled; max77705-fuelgauge has one): hw.c charge_ctl, inverted. test-power limiter checks pass (2026-11-19)"
  power_measured: "2026-11-19, fuel gauge in slate mode (test-power): ~800 mW active (test pattern, backlight 128 of 306), ~435 mW dim, 125-150 mW off (blanked, CPUs capped). A dark PHONEBOX page instead of the pattern reads ~470 mW active: OLED"
  cpufreq: "big cluster 650-2314 MHz, but the hotplug governor (HP_GOV) caps it at 1794 MHz with all 4 big cores online; little 455-1950 MHz"
  boot_to_paneld_ms: 3205   # paneld_start_ms on the source kernel (S8: 1426); not trimmed yet
  boots_without_battery: no (battery not removable)
  battery_seen: "2026-11-19 under LineageOS: 13 %, Charging/Fast, health Good, fg_fullcapnom 3300 mAh, fg_asoc 99, battery_cycle -1"

sensors:
  rotation: "expected manual only: CONFIG_SENSORS_SSP_BBD, the SSP hub runs on the GPS chip as on the S8. To check"
  ssp_sensors: accelerometer, barometer, grip, gyro, hrm, light, magnetic, proximity, thermistor (sysfs ssp_sensor under LineageOS)

wifi:
  chip: Broadcom BCM4361 rev B2 over PCIe (bcmdhd 101.16.63, built in); Semco module (OTP VID 91 33 -> nvram r02a)
  firmware: "/vendor/firmware on the LineageOS 24.0 VENDOR partition (mounted read-only from PhoneKit, 2026-11-19) into prebuilt/firmware/lib/firmware: bcmdhd_sta.bin_b0/_b2, nvram.txt_r02a_b2/_r02b_b2/_murata_r041_b2, bcmdhd_clm.blob. The driver picks bcmdhd_sta.bin_b2 + nvram.txt_r02a_b2 and loads them with request_firmware() (DHD_LINUX_STD_FW_API), so they go to /lib/firmware, not /vendor/etc/wifi as on the S8. CLM 201112"
  mac: "the chip's OTP holds the phone's own MAC (6c:c7:ec:..); a copy of /efs/wifi/.mac.info is in the image too (prebuilt/firmware/efs-root). Before the first interface-up wlan0 shows a 00:90:4c placeholder"
  status: "2026-11-19: joins WPA2-PSK (CCMP) on 2.4 GHz, DHCP, DNS (after the /etc/resolv.conf link), 3/3 pings to 1.1.1.1 at ~30 ms; 130 Mbit/s at -74 dBm; power save on; scan in 4 s"
  power: "~12 mW connected and idle (screen off: 160 vs 148 mW); ~90 mW more for some seconds after a (re)join"
  tethering: "WI-FI MODEM path verified 2026-11-19: ip_forward + MASQUERADE out of wlan0, the PC fetched a page through the phone (HTTP 200) with its own default route untouched"
  quirks: "logstrs.bin (not shipped) made every power-up wait 25 s for the firmware user helper, and paneld's 25 s scan timeout then killed ifconfig mid power-up (request_irq -4): kernel/phonepanel.cfg turns CONFIG_FW_LOADER_USER_HELPER_FALLBACK off"

bluetooth:
  chip: Broadcom BCM4361 B2 on UART 10840000.uart (/dev/ttySAC1, 204:65; Samsung's init chowns it to bluetooth), power through bcm43xx.c's rfkill "bcm43xx Bluetooth"
  firmware: "bcm4361B2_semco.hcd (108067 B, 439 HCI records) from /vendor/firmware into prebuilt/firmware/lib/firmware; libbt-vendor picks _semco/_murata by module"
  bring_up: "paneld/bt_bcm.c (hw.c .bt = HW_BT_BCM_UART): rfkill on, 115200 8N1 RTS/CTS, HCI reset, 3 Mbaud (0xfc18), Download Minidriver (0xfc2e), patchram, back to 115200, reset, 3 Mbaud, Write BD_ADDR (0xfc01) from /efs/bluetooth/bt_addr. 785 ms (10.5 s when the patch went at 115200). Then the XCover's vhci bridge; kernel/phonepanel.cfg adds CONFIG_BT_HCIVHCI"
  address: "the phone's own C0:BD:C8:.. from a copy of /efs/bluetooth/bt_addr (prebuilt/firmware/efs-root); without it the chip answers with Broadcom's shared default 43:61:B2:00:1F:AC"
  status: "2026-11-19: hci0, inquiry, discoverable as PhoneKit; the owner's Android phone paired it as keyboard + mouse; typing and the pointer work (owner, by eye). PhoneKit sends US key positions: with a QWERTZ layout on the host '+' came out as '*' until the host's physical keyboard layout was set to English (US)"
  power: "~40 mW with a connected host (screen off: 319 vs 279 mW, one measurement)"

quirks:
  - "the ROM rewrites RECOVERY at boot (persist.vendor.recovery_update=true): set it to false before flashing PhoneKit"
  - "the ROM spoofs ro.build.type, ro.debuggable and the bootloader lock props; adb root works anyway"
  - "DTB/DTBO partitions are empty; the DT table (DTBH, 305152 B) is inside boot and recovery"
  - "no devtmpfs in the ROM kernel (like the S8's TWRP kernel): paneld creates the /dev memory nodes itself"
  - "USB config must be named 'Conf 1': configfs.c is_symboliclink_change_mode() treats other names as a GSI image, and the first mode switch left only the ACM ports (dmesg 'ADB Only mode for recovery or VTS test'). hw.c usb_config_name"
  - "HP_GOV caps the big cluster at 1794 MHz with 4 big cores online; paneld's restore reads back 1794000, not cpuinfo_max 2314000"
  - "virt-manager (SPICE USB auto-redirect) on the test PC grabbed the phone at every re-enumeration (docs/recovery.md)"
  - "the bootloader ignores the boot image's cmdline (initcall_debug never reached /proc/cmdline): kernel options have to be built in (CONFIG_CMDLINE_EXTEND)"
  - "RESCUE's on-screen keyboard cuts two labels in portrait at 1440 px ('Dow', 'Righ')"
  - "RECOVERY is 68149248 B, not a multiple of 64 KiB: phone.sh now keeps the settings store with 4 KiB blocks (it was overwritten on every deploy)"
  - "PhoneKit has no /dev/block: to read a partition from PhoneKit, mknod it from /sys/class/block/<name>/dev (VENDOR = sda19 = 259:3)"

