name: ci
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-static python3-yaml
      - name: Device database
        run: scripts/devicedb.py check
      - name: Device table is up to date
        run: scripts/devicedb.py table && git diff --exit-code docs/devices.md
      - name: Fuzz the JSON tokenizer (ASan + UBSan)
        run: |
          gcc -fsanitize=address,undefined -fno-sanitize-recover=all -g -D_GNU_SOURCE -Ipaneld tests/fuzz_json.c paneld/json.c -o fuzz_json
          ./fuzz_json 300000
      - name: Build paneld for every device (its own device.mk settings) and run each under qemu
        # A port must not break another phone: every device folder's settings (-D defines) have to build and start.
        run: |
          for mk in devices/*/device.mk; do
            dev=$(basename "$(dirname "$mk")")
            [ "$dev" = _template ] && continue
            echo "::group::$dev"
            make device="$dev" out/"$dev"/paneld
            make device="$dev" test
            echo "::endgroup::"
          done
      - name: DECK mode and drawing (ASan + UBSan)
        run: |
          gcc -fsanitize=address,undefined -fno-sanitize-recover=all -g -D_GNU_SOURCE -Ipaneld tests/test_deck.c \
              paneld/deck.c paneld/gfx.c out/samsung-xcoverpro/fonts.c -lm -o test_deck
          ./test_deck
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
